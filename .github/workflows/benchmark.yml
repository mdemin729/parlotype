name: Benchmark Regression Check

on:
  pull_request:
    paths:
      - 'src/Parlotype.Core/**'
      - 'src/Parlotype.Platform/**'
      - 'src/Parlotype.Benchmark/**'
  workflow_dispatch:
    inputs:
      baseline_run_id:
        description: 'Baseline run ID to compare against (or "latest")'
        required: false
        default: 'latest'

jobs:
  benchmark:
    # Windows-only: Whisper.net's native ggml library hard-crashes the test
    # host on Linux (GGML_ASSERT(prev != ggml_uncaught_exception) while
    # loading libggml-base-whisper.so, independent of CPU/CUDA/Vulkan
    # selection) — reproduced locally, root cause not resolved. Revisit
    # ubuntu-latest once that's fixed upstream or worked around.
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Parlotype.slnx

      - name: Build
        run: dotnet build Parlotype.slnx --no-restore

      - name: Run tests
        run: dotnet test --no-build

      - name: Install FFmpeg
        # AudioFileLoader shells out to ffmpeg for FLAC samples (e.g. the
        # smoke-test dataset) — not preinstalled on windows-latest. Chocolatey
        # is preinstalled on GitHub-hosted Windows runners and non-interactive,
        # unlike winget which can hit MS Store consent prompts in CI.
        run: choco install ffmpeg -y --no-progress

      - name: Run benchmark
        shell: bash
        run: |
          dotnet run --project src/Parlotype.Benchmark --no-build -- run \
            --config datasets/smoke-test-config.json \
            --datasets datasets \
            --output results

      - name: Check for regressions
        if: inputs.baseline_run_id != ''
        shell: bash
        run: |
          dotnet run --project src/Parlotype.Benchmark --no-build -- check \
            --baseline ${{ inputs.baseline_run_id || 'latest' }} \
            --current latest \
            --output results \
            --max-wer-delta 2.0 \
            --max-cer-delta 1.0 \
            --max-rtf-delta 0.1

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: results/
          retention-days: 30
