name: Release

on:
  push:
    tags:
      - 'v*'
  # Dry run: packs and validates the installer without uploading or signing.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to pack (SemVer 2, no leading v). Must sort above every published release.'
        required: false
        # Deliberately absurd, and it has to be. The delta step below downloads
        # the live release feed into Releases/, and `vpk pack` refuses to build a
        # version equal to or lower than anything already in that folder. A
        # plausible-looking 0.0.1-dryrun fails the moment a real release exists.
        default: '9999.0.0-dryrun'
  # Packaging breaks quietly — a lost --self-contained flag or a Program.Main
  # that no longer calls VelopackApp.Run() only shows up at pack time. Exercise
  # the dry-run path on PRs that touch anything packaging-related.
  pull_request:
    paths:
      - 'src/Parlotype.Desktop/**'
      - 'src/Parlotype.Core/**'
      - 'src/Parlotype.Platform/**'
      - 'Directory.Build.*'
      - '.github/workflows/release.yml'

permissions:
  contents: write
  # Azure Artifact Signing authenticates by OIDC — no client secret is stored
  # anywhere. Fork PRs get this downgraded to read, which is fine: they take the
  # dry-run path and never reach the login step (ADR-058).
  id-token: write

env:
  # Permanent (ADR-053). Velopack derives the install directory
  # %LOCALAPPDATA%\{PACK_ID} from this, so it can never change without
  # orphaning every existing install.
  PACK_ID: Parlotype
  PACK_TITLE: Parlotype
  PACK_AUTHORS: Maksim Demin
  REPO_URL: https://github.com/mdemin729/parlotype
  VELOPACK_VERSION: '1.2.0'

jobs:
  release:
    name: Pack ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    # Names the subject of the Entra federated credential
    # (repo:mdemin729/parlotype:environment:release). It must carry no deployment
    # branch/tag policy — one would block the PR and dispatch dry runs, which
    # declare the same environment but never sign.
    environment: release

    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
            channel: win
            main_exe: Parlotype.exe
          # Adding a platform is adding a row here — nothing below reads a RID,
          # a runner or a channel except through `matrix`:
          # - { rid: osx-arm64, runner: macos-14,      channel: osx,   main_exe: Parlotype }
          # - { rid: osx-x64,   runner: macos-13,      channel: osx,   main_exe: Parlotype }
          # - { rid: linux-x64, runner: ubuntu-latest, channel: linux, main_exe: Parlotype }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 8.0 is not used to build anything. The Artifact Signing dlib that vpk
      # bundles for Azure signing is built against .NET 8 and will not load
      # without that runtime present.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Tag pushes release; everything else is a dry run that must not upload.
      - name: Resolve version and mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
            echo "DRY_RUN=false" >> "$GITHUB_ENV"
          else
            version="${{ github.event.inputs.version || '9999.0.0-dryrun' }}"
            echo "DRY_RUN=true" >> "$GITHUB_ENV"
          fi

          # Velopack wants SemVer 2; a four-part 1.2.3.4 is not handled well.
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a SemVer 2 version (expected MAJOR.MINOR.PATCH[-prerelease])."
            exit 1
          fi

          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Packing version $version (dry run: ${DRY_RUN:-see above})"

      # Runs before the build so a missing changelog section costs seconds
      # rather than a 20-minute publish. CHANGELOG.md is the source of truth for
      # what a release says (ADR-054); the body is applied after upload below.
      - name: Extract release notes
        shell: bash
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            # No version section exists yet on a dry run — only check the file
            # is still shaped the way the extractor expects.
            grep -q '^## \[Unreleased\]' CHANGELOG.md \
              || { echo "::error::CHANGELOG.md has no '## [Unreleased]' heading."; exit 1; }
            echo "Dry run — skipping the version-section requirement."
            exit 0
          fi

          # A version section runs from '## [X.Y.Z]' to the next '## ' heading,
          # or to the link-reference definitions that close the file (which
          # would otherwise be swept into the oldest version's section).
          # Plain string comparison, no regex: the version contains dots and the
          # headings contain brackets, and escaping those survives neither
          # YAML nor every awk implementation intact.
          awk -v ver="$VERSION" '
            BEGIN { want = "## [" ver "]"; n = length(want) }
            !inside && substr($0, 1, n) == want { inside = 1; next }
            inside && substr($0, 1, 3) == "## " { exit }
            inside && substr($0, 1, 1) == "[" && index($0, "]: http") { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md

          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no non-empty '## [$VERSION]' section. Run /release-notes and merge that PR before tagging."
            exit 1
          fi

          echo "--- release notes for $VERSION ---"
          cat release-notes.md

      - name: Restore
        run: dotnet restore Parlotype.slnx

      - name: Test (gate)
        run: dotnet test --no-restore

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version ${{ env.VELOPACK_VERSION }}

      # --self-contained is also pinned in Parlotype.Desktop.csproj so it cannot
      # be lost by editing this file. Do not add --framework: that is for
      # non-self-contained apps and would add an elevation prompt to setup.
      - name: Publish
        run: >
          dotnet publish src/Parlotype.Desktop
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:Version=${{ env.VERSION }}
          -o publish

      # Delta packages can only be built against releases that are present
      # locally. Without this every release ships as a full ~80 MB download.
      # Expected to fail on the very first release, when no feed exists yet.
      # Once it does succeed, everything it downloads constrains the version the
      # Pack step below will accept — see the dry-run default at the top.
      - name: Download existing releases (for delta generation)
        continue-on-error: true
        run: >
          vpk download github
          --repoUrl "${{ env.REPO_URL }}"
          --channel "${{ matrix.channel }}"
          --outputDir Releases
          --token "${{ secrets.GITHUB_TOKEN }}"

      # Only tag pushes have credentials. vpk's bundled dlib authenticates via
      # DefaultAzureCredential, which falls through to the Azure CLI credential
      # this step leaves behind — no client secret is involved.
      - name: Azure login (signing)
        if: env.DRY_RUN == 'false'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # vpk reads VPK_AZURE_TRUSTED_SIGN_FILE from the environment, so signing is
      # enabled by setting a variable rather than by changing the Pack command —
      # the pack invocation below is byte-for-byte what an unsigned dry run runs.
      - name: Enable code signing
        if: env.DRY_RUN == 'false'
        shell: pwsh
        run: |
          $missing = @()
          if (-not $env:SIGN_ENDPOINT) { $missing += 'SIGN_ENDPOINT' }
          if (-not $env:SIGN_ACCOUNT)  { $missing += 'SIGN_ACCOUNT' }
          if (-not $env:SIGN_PROFILE)  { $missing += 'SIGN_PROFILE' }
          if ($missing) {
            Write-Host "::error::Repository variables not set: $($missing -join ', ') — cannot sign this release."
            exit 1
          }
          # The endpoint must name the same region the signing account and the
          # certificate profile live in; a mismatch surfaces as a 403 from
          # SignerSign() rather than as anything that mentions regions.
          $json = @{
            Endpoint               = $env:SIGN_ENDPOINT
            CodeSigningAccountName = $env:SIGN_ACCOUNT
            CertificateProfileName = $env:SIGN_PROFILE
          } | ConvertTo-Json
          # UTF-8 *without* BOM. The dlib fails to parse the file if one is present,
          # and Set-Content/Out-File on Windows PowerShell would write one.
          $path = Join-Path $PWD 'signing.json'
          [IO.File]::WriteAllText($path, $json, [Text.UTF8Encoding]::new($false))
          "VPK_AZURE_TRUSTED_SIGN_FILE=$path" >> $env:GITHUB_ENV
        env:
          SIGN_ENDPOINT: ${{ vars.SIGN_ENDPOINT }}
          SIGN_ACCOUNT: ${{ vars.SIGN_ACCOUNT }}
          SIGN_PROFILE: ${{ vars.SIGN_PROFILE }}

      # Signing is switched on by the two steps above, purely through
      # VPK_AZURE_TRUSTED_SIGN_FILE. Signing must run inside vpk rather than over
      # Releases/ afterwards: Update.exe is signed before it is embedded in the
      # .nupkg, and Setup.exe after its payload is appended (ADR-058). A run with
      # no credentials simply packs unsigned, which is what dry runs and fork PRs
      # need.
      # Every value is quoted: PACK_AUTHORS ("Maksim Demin") has a space, and an
      # unquoted interpolation here splits on it — vpk then sees a stray
      # positional argument and rejects the whole command.
      - name: Pack
        run: >
          vpk pack
          --packId "${{ env.PACK_ID }}"
          --packTitle "${{ env.PACK_TITLE }}"
          --packAuthors "${{ env.PACK_AUTHORS }}"
          --packVersion "${{ env.VERSION }}"
          --packDir publish
          --mainExe "${{ matrix.main_exe }}"
          --channel "${{ matrix.channel }}"
          --outputDir Releases
          --icon src/Parlotype.Desktop/Assets/parlotype.ico

      - name: Verify pack output
        shell: bash
        run: |
          ls -la Releases
          # The feed is what installed clients poll; without it nothing can update.
          test -f "Releases/releases.${{ matrix.channel }}.json" \
            || { echo "::error::No release feed was produced."; exit 1; }
          if ls Releases/*-delta.nupkg >/dev/null 2>&1; then
            echo "Delta package built."
          else
            echo "::notice::No delta package — expected only for the first release on this channel."
          fi

      # A signing failure inside vpk is not always fatal to the pack, so assert on
      # the output rather than on the exit code. Checking the portable zip as well
      # as Setup.exe is deliberate: it proves the *packaged application* binaries
      # were signed, not just the installer wrapping them.
      - name: Verify signatures
        if: env.DRY_RUN == 'false' && runner.os == 'Windows'
        shell: pwsh
        run: |
          function Assert-Signed($path) {
            $sig = Get-AuthenticodeSignature $path
            Write-Host "$([IO.Path]::GetFileName($path)): $($sig.Status) — $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') {
              Write-Host "::error::$path is not validly signed ($($sig.Status))."
              exit 1
            }
            # Artifact Signing certificates are valid for 72 hours. Without a
            # timestamp every signature starts failing three days after release.
            if (-not $sig.TimeStamperCertificate) {
              Write-Host "::error::$path has no RFC3161 timestamp; the signature expires in 72 hours."
              exit 1
            }
          }

          Assert-Signed "Releases/${{ env.PACK_ID }}-${{ matrix.channel }}-Setup.exe"

          $portable = "Releases/${{ env.PACK_ID }}-${{ matrix.channel }}-Portable.zip"
          if (Test-Path $portable) {
            Expand-Archive $portable -DestinationPath sigcheck -Force
            Assert-Signed "sigcheck/${{ matrix.main_exe }}"
            Remove-Item sigcheck -Recurse -Force
          }

      - name: Upload artifacts (dry run)
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: velopack-${{ matrix.rid }}
          path: Releases
          retention-days: 7

      # --merge lets each matrix row attach to the same GitHub release, so
      # adding macOS/Linux rows does not need any change here.
      - name: Upload to GitHub Releases
        if: env.DRY_RUN == 'false'
        run: >
          vpk upload github
          --repoUrl "${{ env.REPO_URL }}"
          --channel "${{ matrix.channel }}"
          --outputDir Releases
          --token "${{ secrets.GITHUB_TOKEN }}"
          --tag "${{ github.ref_name }}"
          --releaseName "Parlotype ${{ env.VERSION }}"
          --merge true
          --publish true
          --pre ${{ contains(github.ref_name, '-') }}

      # vpk creates the release with a title and assets but no body, and GitHub
      # then renders the tagged commit's message instead — which for a
      # squash-merged PR is the whole engineering commit body. Overwrite it with
      # the curated notes. Writing after upload (rather than passing a vpk flag)
      # keeps this independent of the Velopack CLI and idempotent under --merge:
      # every matrix row writes the identical body.
      - name: Set release notes
        if: env.DRY_RUN == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release edit "${{ github.ref_name }}"
          --notes-file release-notes.md
          --repo "${{ github.repository }}"
